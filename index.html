<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="description" content="聖經概覽互動閱讀網站。完整保留原始 Excel 資料、家譜跨頁連結、圖片與註解。">
  <title>聖經概覽｜互動資料庫</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="firebase-config.js"></script>
  <script defer src="app.js"></script>
  <script type="module" src="firebase-loader.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主要導覽">
      <a class="brand" href="#/" aria-label="聖經概覽首頁">
        <span class="brand-mark" aria-hidden="true"><span>B</span><span class="mark-cross">✛</span></span>
        <span class="brand-copy"><strong>聖經概覽</strong><small>BIBLE OVERVIEW</small></span>
      </a>
      <div class="nav-label">探索資料</div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="sidebar-bottom"><span class="sidebar-line"></span><p>忠實保留原始資料<br>以更清楚的方式閱讀</p><span class="source-link">資料由 Firebase Cloud Firestore 提供</span></div>
    </aside>
    <div class="mobile-scrim" id="mobile-scrim"></div>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="開啟選單" title="開啟選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span id="top-section" class="top-section">資料導覽</span><span class="top-divider"></span><span id="top-page" class="top-page">首頁</span></div>
        <div class="topbar-right"><button type="button" class="icon-btn search-shortcut" id="search-shortcut" title="搜尋全站" aria-label="搜尋全站"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.8 4.8"/></svg></button><button type="button" class="theme-btn" id="theme-btn" title="切換深淺色模式" aria-label="切換深淺色模式"><span id="theme-symbol">☾</span><span id="theme-label">深色模式</span></button></div>
      </header>
      <main id="main" class="main" tabindex="-1"><div class="loading-view">正在載入內容…</div></main>
      <footer class="site-footer">聖經概覽 <span>·</span> 資料來自原始《聖經概覽》 <span>·</span> 透過 Firebase 讀取</footer>
    </div>
  </div>
  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
